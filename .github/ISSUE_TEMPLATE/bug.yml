name: Bug report
description: Report a reproducible installation, validation, routing, or workflow defect.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Do not include credentials, customer data, paid material, private notes, or unpatched vulnerability details.
  - type: input
    id: version
    attributes:
      label: Semantic SEO Geek version
      placeholder: 1.0.0
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Agent environment
      options:
        - Codex
        - Claude Code
        - Local validation only
    validations:
      required: true
  - type: input
    id: environment-version
    attributes:
      label: Agent environment version
      description: Include the exact CLI or application version when available.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: List the smallest steps and sanitized inputs that reproduce the defect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and sanitized output
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: I removed secrets, private data, paid material, and proprietary source text.
          required: true
        - label: This report does not disclose an unpatched vulnerability.
          required: true
