name: Validate public plugin

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Validate checked-out public tree strictly
        run: |
          strict_tree="${RUNNER_TEMP}/semantic-seo-geek-strict-tree"
          mkdir -p "$strict_tree"
          git archive --format=tar HEAD | tar -xf - -C "$strict_tree"
          python scripts/validate.py check --strict "$strict_tree"

      - name: Build and rescan deterministic archive
        run: >-
          python scripts/validate.py build .
          --format tar.gz
          --output "${{ runner.temp }}/semantic-seo-geek.tar.gz"
